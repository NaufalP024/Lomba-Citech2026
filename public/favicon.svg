<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="cityGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D8FF" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </linearGradient>
    <linearGradient id="bldgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#1E3A8A" />
    </linearGradient>
    <linearGradient id="bldgGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F0F9FF" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Dark Rounded Container -->
  <rect width="64" height="64" rx="16" fill="#0B132B" />
  <rect width="60" height="60" x="2" y="2" rx="14" fill="none" stroke="url(#cityGrad)" stroke-width="1.5" opacity="0.6" />
  
  <!-- Smart City Grid Signal Ring -->
  <circle cx="32" cy="18" r="4" fill="none" stroke="#00D8FF" stroke-width="1.5" opacity="0.8" />
  <circle cx="32" cy="18" r="1.5" fill="#00D8FF" filter="url(#glow)" />
  
  <!-- 3D City Skyscrapers -->
  <!-- Left Building -->
  <rect x="14" y="28" width="10" height="26" rx="1.5" fill="url(#bldgGrad)" />
  <rect x="17" y="32" width="4" height="3" rx="0.5" fill="#38BDF8" opacity="0.9" />
  <rect x="17" y="38" width="4" height="3" rx="0.5" fill="#38BDF8" opacity="0.9" />
  <rect x="17" y="44" width="4" height="3" rx="0.5" fill="#38BDF8" opacity="0.9" />

  <!-- Center Main Skyscraper -->
  <rect x="26" y="20" width="12" height="34" rx="2" fill="url(#bldgGlow)" stroke="#38BDF8" stroke-width="0.8" />
  <polygon points="32,12 26,20 38,20" fill="#38BDF8" />
  <line x1="32" y1="8" x2="32" y2="12" stroke="#00D8FF" stroke-width="1.5" stroke-linecap="round" />
  <circle cx="32" cy="7" r="1.2" fill="#00D8FF" filter="url(#glow)" />
  
  <rect x="29" y="24" width="6" height="3.5" rx="0.5" fill="#0284C7" />
  <rect x="29" y="30" width="6" height="3.5" rx="0.5" fill="#0284C7" />
  <rect x="29" y="36" width="6" height="3.5" rx="0.5" fill="#0284C7" />
  <rect x="29" y="42" width="6" height="3.5" rx="0.5" fill="#0284C7" />

  <!-- Right Building -->
  <rect x="40" y="25" width="10" height="29" rx="1.5" fill="url(#bldgGrad)" />
  <rect x="43" y="29" width="4" height="3" rx="0.5" fill="#38BDF8" opacity="0.9" />
  <rect x="43" y="35" width="4" height="3" rx="0.5" fill="#38BDF8" opacity="0.9" />
  <rect x="43" y="41" width="4" height="3" rx="0.5" fill="#38BDF8" opacity="0.9" />
  <rect x="43" y="47" width="4" height="3" rx="0.5" fill="#38BDF8" opacity="0.9" />

  <!-- Ground Cyber Line -->
  <line x1="10" y1="54" x2="54" y2="54" stroke="#00D8FF" stroke-width="2" stroke-linecap="round" filter="url(#glow)" />
</svg>
